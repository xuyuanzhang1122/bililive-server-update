server {
    listen 80;
    server_name update.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name update.example.com;

    ssl_certificate /etc/letsencrypt/live/update.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update.example.com/privkey.pem;

    client_max_body_size 50m;

    access_log /var/log/nginx/bililive-server-update.access.log;
    error_log /var/log/nginx/bililive-server-update.error.log;

    location = /health {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Optional hardening: restrict catalog mutation APIs to an admin network.
    # location ~ ^/api/v1/catalog/(sync-github|releases|tools)$ {
    #     allow 203.0.113.10;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8090;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

